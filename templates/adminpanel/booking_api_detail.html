{% extends 'adminpanel/base.html' %}

{% block title %}Booking Details | Vivaan Admin{% endblock %}
{% block header %}Booking Details{% endblock %}

{% block content %}

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h2 id="booking-title">Booking #...</h2>
        <a href="/vivvan_admin/bookings/" class="btn-back">← Back</a>
    </div>

    <!-- CARD -->
    <div class="card">

        <!-- STATUS -->
        <div id="status-section"></div>

        <!-- ACTION -->
        <div class="update-box">

            <!-- STATUS DROPDOWN -->
            <div class="dropdown">
                <div class="dropdown-selected" onclick="toggleDropdown('statusDropdown', event)">
                    <span id="statusSelected">Select Status</span>
                </div>
                <div class="dropdown-menu" id="statusDropdown">
                    <div onclick="selectOption('status','pending')">Pending</div>
                    <div onclick="selectOption('status','confirmed')">Confirmed</div>
                    <div onclick="selectOption('status','cancelled')">Cancelled</div>
                    <div onclick="selectOption('status','completed')">Completed</div>
                </div>
            </div>

            <!-- PAYMENT DROPDOWN -->
            <div class="dropdown">
                <div class="dropdown-selected" onclick="toggleDropdown('paymentDropdown', event)">
                    <span id="paymentSelected">Payment</span>
                </div>
                <div class="dropdown-menu" id="paymentDropdown">
                    <div onclick="selectOption('payment','pending')">Pending</div>
                    <div onclick="selectOption('payment','partial')">Partial</div>
                    <div onclick="selectOption('payment','paid')">Paid</div>
                </div>
            </div>

            <button onclick="updateBooking()" class="btn-update">
                Update
            </button>

        </div>

        <!-- DETAILS -->
        <div id="booking-detail" class="grid"></div>

    </div>

</div>

<style>

/* ===== BASE ===== */
.container {
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:15px;
}

/* ===== CARD ===== */
.card {
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.06);
}

/* ===== BUTTON ===== */
.btn-update {
    background:linear-gradient(135deg,#16a34a,#22c55e);
    color:#fff;
    border:none;
    padding:12px 16px;
    border-radius:10px;
    cursor:pointer;
    width:140px;
}

.btn-back {
    background:#f3f4f6;
    padding:8px 14px;
    border-radius:8px;
    text-decoration:none;
}

/* ===== DROPDOWN ===== */
.dropdown {
    position:relative;
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
    cursor:pointer;
    min-width:160px;
}

.dropdown-selected {
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.dropdown-selected::after {
    content:"▼";
    font-size:10px;
}

.dropdown-menu {
    display:none;
    position:absolute;
    top:110%;
    left:0;
    width:100%;
    background:#fff;
    border-radius:10px;
    box-shadow:0 10px 20px rgba(0,0,0,0.1);
    z-index:10;
}

.dropdown-menu div {
    padding:10px;
    cursor:pointer;
}

.dropdown-menu div:hover {
    background:#f3f4f6;
}

/* ===== STATUS ===== */
.badge {
    padding:8px 16px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.confirmed { background:#dcfce7; color:#166534; }
.pending { background:#fef3c7; color:#92400e; }
.cancelled { background:#fee2e2; color:#991b1b; }

.status-box {
    text-align:center;
    margin-bottom:15px;
}

/* ===== GRID ===== */
.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.section {
    background:#f9fafb;
    padding:15px;
    border-radius:12px;
}

/* ===== ACTION ===== */
.update-box {
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:20px;
    flex-wrap:wrap;
}

/* ===== MOBILE ===== */
@media (max-width:768px) {

    .grid {
        grid-template-columns:1fr;
    }

    .dropdown {
        width:100%;
    }

    .btn-update {
        width:100%;
    }

}

</style>

<script>

let selectedStatus = "pending";
let selectedPayment = "pending";

/* TOGGLE DROPDOWN */
function toggleDropdown(id, event) {
    event.stopPropagation();

    document.querySelectorAll(".dropdown-menu").forEach(menu => {
        if (menu.id !== id) {
            menu.style.display = "none";
        }
    });

    let dropdown = document.getElementById(id);

    dropdown.style.display =
        dropdown.style.display === "block" ? "none" : "block";
}

/* SELECT OPTION */
function selectOption(type, value) {

    if(type === "status"){
        selectedStatus = value;
        document.getElementById("statusSelected").innerText = value.toUpperCase();
        document.getElementById("statusDropdown").style.display="none";
    }

    if(type === "payment"){
        selectedPayment = value;
        document.getElementById("paymentSelected").innerText = value.toUpperCase();
        document.getElementById("paymentDropdown").style.display="none";
    }
}

/* CLOSE ON OUTSIDE CLICK */
document.addEventListener("click", function () {
    document.querySelectorAll(".dropdown-menu").forEach(menu => {
        menu.style.display = "none";
    });
});

/* LOAD BOOKING */
function loadBooking() {

fetch(`https://farmhouseshyderabad.com/farmhouse_admin/owner/bookings/detail/{{ booking_id }}/`, {
    credentials:"include"
})
.then(res=>res.json())
.then(data=>{

    document.getElementById("booking-title").innerText =
        "Booking #" + data.booking_id;

    document.getElementById("status-section").innerHTML = `
        <div class="status-box">
            <span class="badge ${data.status}">
                ${data.status.toUpperCase()}
            </span>
        </div>
    `;

    selectedStatus = data.status;
    selectedPayment = data.payment_status;

    document.getElementById("statusSelected").innerText = data.status.toUpperCase();
    document.getElementById("paymentSelected").innerText = data.payment_status.toUpperCase();

    document.getElementById("booking-detail").innerHTML = `
        <div class="section">
            <h4>Guest</h4>
            <p>${data.guest_name}</p>
            <p>${data.guest_phone}</p>
        </div>

        <div class="section">
            <h4>Stay</h4>
            <p>${data.check_in}</p>
            <p>${data.check_out}</p>
        </div>

        <div class="section">
            <h4>Payment</h4>
            <p>${data.payment_status}</p>
            <p>₹${data.total_amount}</p>
        </div>

        <div class="section">
            <h4>Date</h4>
            <p>${new Date(data.created_at).toLocaleString("en-IN")}</p>
        </div>
    `;
});
}

/* UPDATE BOOKING */
function updateBooking() {
    const FARMHOUSE_SLUG = "vivaan-farmhouse";

{% comment %} fetch(`https://farmhouseshyderabad.com/farmhouse_admin/owner/bookings/{{ booking_id }}/update/`, { {% endcomment %}
    
    fetch(`https://farmhouseshyderabad.com/farmhouse_admin/owner/bookings/{{ booking_id }}/update/?farmhouse=${FARMHOUSE_SLUG}`, {
    method:"PATCH",
    headers:{
        "Content-Type":"application/json",
        "X-CSRFToken":getCSRFToken()
    },
    credentials:"include",
    body:JSON.stringify({
        status:selectedStatus,
        payment_status:selectedPayment
    })
})
.then(()=>{
    alert("Updated successfully ✅");
    loadBooking();
});
}

/* CSRF */
function getCSRFToken(){
    return document.cookie
        .split("; ")
        .find(row => row.startsWith("csrftoken"))
        ?.split("=")[1];
}

loadBooking();

</script>

{% endblock %}
