{% extends "adminpanel/base.html" %}
{% block title %}Group{% endblock %}
{% block header %}Group{% endblock %}

{% block content %}

<style>

/* CARD */
.form-card {
    max-width: 900px;
    margin: 20px auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,.08);
}

/* HEADER */
.card-header {
    padding: 1.5rem;
    border-bottom: 1px solid #eee;
}

/* BODY */
.form-body {
    padding: 1.5rem;
}

/* INPUT */
.form-group {
    margin-bottom: 15px;
}

.form-group label {
    font-weight: 600;
    margin-bottom: 5px;
    display: block;
}

.form-input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* PERMISSION GRID */
.permission-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
}

/* ITEM */
.permission-item {
    background: #f9fafb;
    padding: 8px;
    border-radius: 8px;
}

/* ACTION */
.form-actions {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.btn-save {
    background: #034012;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
}

.btn-cancel {
    background: #eee;
    padding: 10px 16px;
    border-radius: 8px;
    text-decoration: none;
}

/* MOBILE */
@media (max-width: 768px) {

    .form-card {
        margin: 10px;
    }

    .permission-grid {
        grid-template-columns: 1fr;
    }

    .form-actions {
        flex-direction: column-reverse;
    }

    .btn-save,
    .btn-cancel {
        width: 100%;
        text-align: center;
    }
}

</style>

<div class="form-card">

    <div class="card-header">
        <h2>{% if group %}Edit{% else %}Create{% endif %} Group</h2>
    </div>

    <form method="POST" class="form-body">
        {% csrf_token %}

        <!-- NAME -->
        <div class="form-group">
            <label>Group Name</label>
            <input type="text" name="name" class="form-input"
                   value="{{ group.name|default:'' }}" required>
        </div>

        <!-- PERMISSIONS -->
        <div class="form-group">
            <label>Permissions</label>

            <div class="permission-grid">
                {% for perm in permissions %}
                <label class="permission-item">
                    <input type="checkbox" name="permissions" value="{{ perm.id }}"
                        {% if group and perm in group.permissions.all %}checked{% endif %}>
                    {{ perm.name }}
                </label>
                {% endfor %}
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="form-actions">
            <a href="{% url 'vivaan_admin:group_list' %}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-save">Save Group</button>
        </div>

    </form>

</div>

{% endblock %}
