{% extends "resort/base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block meta %}
<meta name="robots" content="noindex, nofollow">
{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">

    <h1 class="text-6xl font-bold text-orange-500 mb-4">404</h1>

    <p class="text-xl font-semibold text-gray-700 mb-2">
        Page not found
    </p>

    <p class="text-gray-500 mb-6">
        The page you are looking for doesn’t exist or may have been removed.
    </p>

    <a href="/"
       class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-lg font-semibold transition">
        Go Home
    </a>

</div>
{% endblock %}
